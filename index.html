<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LITG Stroke Recorder</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>LITG Stroke Recorder</h1>
      <p class="subtitle">Trace stroke order; export with timestamps in the green channel.</p>
    </header>

    <main>
      <section id="drop-zone" class="drop-zone">
        <p>Drop PNG here, or click to browse.</p>
        <input type="file" id="file-input" accept="image/png,image/jpeg" hidden />
      </section>

      <section id="workspace" class="workspace hidden">
        <canvas id="canvas"></canvas>

        <aside class="controls">
          <label>
            Source opacity (<span id="opacity-label">50</span>%)
            <input type="range" id="opacity-slider" min="0" max="100" value="50" />
          </label>

          <label>
            Brush radius (<span id="brush-radius-label">10</span> px)
            <input type="range" id="brush-radius" min="1" max="40" value="10" />
          </label>

          <label>
            Preview duration (<span id="preview-duration-label">4</span> s)
            <input type="range" id="preview-duration" min="150" max="5000" step="50" value="4000" />
          </label>

          <label class="toggle-label">
            <input type="checkbox" id="parallel-toggle" checked />
            Parallel Mode
          </label>

          <label id="stroke-delay-row">
            Stroke delay (<span id="stroke-delay-label">0</span> s)
            <input type="range" id="stroke-delay" min="0" max="2000" step="50" value="0" />
          </label>

          <button id="btn-undo">Undo last stroke</button>
          <button id="btn-clear">Clear all</button>
          <button id="btn-preview">Preview reveal</button>
          <button id="btn-export">Export PNG</button>

          <div class="info">
            <span id="stroke-count">0 strokes</span>
          </div>
        </aside>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
